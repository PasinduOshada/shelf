ShortDescription: Local-first tracker and organizer for the TV and film files on your computer.
Description: |-
  Shelf reads the folders that hold your TV series and films and keeps track of what you own,
  what you have watched and which episodes are missing. It finds duplicate copies, imports your
  TV Time history, and can rename and organize downloads with a preview and undo for every batch.
  Everything stays on your computer and it works offline; artwork and episode lists from TMDB
  are optional.
